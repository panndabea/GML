<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="160" height="192">
  <rect width="200" height="240" fill="#060c14" rx="14"/>

  <!-- label -->
  <text x="100" y="22" fill="#7ac4f8" font-family="system-ui,sans-serif" font-size="10" font-weight="700"
        letter-spacing="2" text-anchor="middle">GROUNDSWELL</text>
  <text x="100" y="218" fill="#4a6a88" font-family="system-ui,sans-serif" font-size="9"
        text-anchor="middle">Lean top edge forward · hold ≥ 1.5 s</text>

  <!-- phone group, pivot at bottom edge of phone (100,175) -->
  <g id="phone">
    <animateTransform attributeName="transform" type="rotate"
      values="0 100 175; -22 100 175; -22 100 175; -22 100 175; 0 100 175; 0 100 175"
      keyTimes="0; 0.25; 0.45; 0.55; 0.75; 1"
      dur="2.8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <!-- phone body -->
    <rect x="70" y="75" width="60" height="100" rx="9" fill="#1e2a3a" stroke="#3d9be9" stroke-width="1.5"/>
    <!-- screen -->
    <rect x="75" y="83" width="50" height="80" rx="5" fill="#0a1628"/>
    <!-- screen glow -->
    <rect x="75" y="83" width="50" height="80" rx="5" fill="rgba(61,155,233,0.15)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <!-- wave on screen -->
    <path d="M75,123 Q87,113 100,123 Q113,133 125,123" fill="none" stroke="#3d9be9" stroke-width="1.5" opacity="0.7">
      <animate attributeName="d"
        values="M75,123 Q87,113 100,123 Q113,133 125,123;M75,127 Q87,115 100,127 Q113,139 125,127;M75,123 Q87,113 100,123 Q113,133 125,123"
        dur="1.4s" repeatCount="indefinite"/>
    </path>
    <!-- speaker -->
    <rect x="88" y="79" width="24" height="3" rx="1.5" fill="#1a3a5a"/>
    <!-- home button -->
    <circle cx="100" cy="173" r="5" fill="none" stroke="#1a3a5a" stroke-width="1.5"/>
  </g>

  <!-- forward direction arrow -->
  <g opacity="0.75">
    <animateTransform attributeName="transform" type="rotate"
      values="0 100 175; -22 100 175; -22 100 175; -22 100 175; 0 100 175; 0 100 175"
      keyTimes="0; 0.25; 0.45; 0.55; 0.75; 1"
      dur="2.8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <path d="M147,110 L158,110 M153,104 L159,110 L153,116" fill="none" stroke="#3d9be9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.3;0.6;0.7;1" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
