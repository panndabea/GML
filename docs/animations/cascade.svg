<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="160" height="192">
  <rect width="200" height="240" fill="#060c14" rx="14"/>

  <!-- label -->
  <text x="100" y="22" fill="#ff9868" font-family="system-ui,sans-serif" font-size="10" font-weight="700"
        letter-spacing="2" text-anchor="middle">CASCADE</text>
  <text x="100" y="218" fill="#4a6a88" font-family="system-ui,sans-serif" font-size="9"
        text-anchor="middle">Tilt ever deeper forward · 3–10 s ramp</text>

  <!-- phone group: progressively deepening tilt, pivoting around bottom -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 100 175; -8 100 175; -18 100 175; -32 100 175; -42 100 175; -42 100 175; 0 100 175"
      keyTimes="0; 0.15; 0.3; 0.5; 0.7; 0.8; 1"
      dur="4s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0 0 1 1; 0.4 0 0.6 1"/>

    <!-- phone body -->
    <rect x="70" y="75" width="60" height="100" rx="9" fill="#1e2a3a" stroke="#ff5824" stroke-width="1.5"/>
    <!-- screen -->
    <rect x="75" y="83" width="50" height="80" rx="5" fill="#0a1628"/>
    <!-- escalation fill on screen -->
    <rect x="75" y="83" width="50" height="80" rx="5" fill="rgba(255,88,36,0.08)">
      <animate attributeName="fill"
        values="rgba(30,100,200,0.1);rgba(30,100,200,0.1);rgba(100,60,20,0.15);rgba(200,80,20,0.2);rgba(255,88,36,0.25);rgba(255,88,36,0.25);rgba(30,100,200,0.1)"
        keyTimes="0;0.05;0.3;0.5;0.7;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- rising bar on screen -->
    <rect x="87" y="83" width="26" height="80" rx="3" fill="none" stroke="rgba(255,88,36,0.25)" stroke-width="1"/>
    <rect x="88" y="163" width="24" height="0" rx="2">
      <animate attributeName="height" values="0;0;12;28;46;46;0" keyTimes="0;0.05;0.3;0.5;0.7;0.8;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="163;163;151;135;117;117;163" keyTimes="0;0.05;0.3;0.5;0.7;0.8;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill"
        values="#1e64c8;#1e64c8;#a04010;#d05010;#ff5824;#ff5824;#1e64c8"
        keyTimes="0;0.05;0.3;0.5;0.7;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- speaker -->
    <rect x="88" y="79" width="24" height="3" rx="1.5" fill="#4a2010"/>
    <!-- home button -->
    <circle cx="100" cy="173" r="5" fill="none" stroke="#4a2010" stroke-width="1.5"/>
  </g>

  <!-- forward direction arrow (intensifying) -->
  <path d="M147,130 L160,130 M154,122 L162,130 L154,138" fill="none" stroke="#ff5824" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0;0;0.4;0.7;1;1;0" keyTimes="0;0.1;0.3;0.5;0.65;0.8;1" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
