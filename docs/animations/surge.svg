<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="160" height="192">
  <rect width="200" height="240" fill="#060c14" rx="14"/>

  <!-- label -->
  <text x="100" y="22" fill="#f0d878" font-family="system-ui,sans-serif" font-size="10" font-weight="700"
        letter-spacing="2" text-anchor="middle">SURGE</text>
  <text x="100" y="218" fill="#4a6a88" font-family="system-ui,sans-serif" font-size="9"
        text-anchor="middle">Snap phone upward sharply · &lt; 0.5 s</text>

  <!-- burst rays (hidden at rest, flash on surge) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.4;0;0;0;0" keyTimes="0;0.1;0.15;0.25;0.35;0.6;0.9;1" dur="2.5s" repeatCount="indefinite"/>
    <line x1="100" y1="75" x2="100" y2="52" stroke="#f0d040" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="75" x2="118" y2="57" stroke="#f0d040" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="75" x2="82" y2="57" stroke="#f0d040" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="75" x2="125" y2="68" stroke="#f0d040" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="100" y1="75" x2="75" y2="68" stroke="#f0d040" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- phone group: sharp snap up then return -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 100 175; 0 100 175; 28 100 175; 5 100 175; 0 100 175; 0 100 175; 0 100 175"
      keyTimes="0; 0.08; 0.15; 0.3; 0.4; 0.7; 1"
      dur="2.5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0 0 1 1; 0 0 0.2 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0 0 1 1; 0 0 1 1"/>
    <!-- phone body -->
    <rect x="70" y="75" width="60" height="100" rx="9" fill="#1e2a3a" stroke="#e8c030" stroke-width="1.5"/>
    <!-- screen -->
    <rect x="75" y="83" width="50" height="80" rx="5" fill="#0a1628"/>
    <!-- energy flash on screen -->
    <rect x="75" y="83" width="50" height="80" rx="5" fill="rgba(240,208,48,0.05)">
      <animate attributeName="fill"
        values="rgba(240,208,48,0.05);rgba(240,208,48,0.05);rgba(240,208,48,0.45);rgba(240,208,48,0.1);rgba(240,208,48,0.05);rgba(240,208,48,0.05)"
        keyTimes="0;0.08;0.15;0.3;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <!-- lightning bolt on screen -->
    <path d="M105,93 L96,113 L103,113 L95,133 L108,108 L101,108 Z" fill="#e8c030" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.3;1;0.4;0.3;0.3" keyTimes="0;0.08;0.15;0.3;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <!-- speaker -->
    <rect x="88" y="79" width="24" height="3" rx="1.5" fill="#4a4010"/>
    <!-- home button -->
    <circle cx="100" cy="173" r="5" fill="none" stroke="#4a4010" stroke-width="1.5"/>
  </g>
</svg>
