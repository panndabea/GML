<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="160" height="192">
  <rect width="200" height="240" fill="#060c14" rx="14"/>

  <!-- label -->
  <text x="100" y="22" fill="#c0a0f8" font-family="system-ui,sans-serif" font-size="10" font-weight="700"
        letter-spacing="2" text-anchor="middle">ORBIT</text>
  <text x="100" y="218" fill="#4a6a88" font-family="system-ui,sans-serif" font-size="9"
        text-anchor="middle">Hold flat · rotate slowly in a circle</text>

  <!-- orbit guide ring -->
  <circle cx="100" cy="125" r="52" fill="none" stroke="rgba(144,96,232,0.2)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- phone group (top-down view, flat rectangle) rotating around center -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 100 125; 360 100 125"
      dur="4s" repeatCount="indefinite" calcMode="linear"/>
    <!-- phone top-down: wide rectangle -->
    <rect x="74" y="108" width="52" height="34" rx="6" fill="#1e2a3a" stroke="#9060e8" stroke-width="1.5"/>
    <!-- screen top-down -->
    <rect x="78" y="112" width="44" height="26" rx="3" fill="#0a1628"/>
    <rect x="78" y="112" width="44" height="26" rx="3" fill="rgba(144,96,232,0.15)"/>
    <!-- camera dot top of phone -->
    <circle cx="100" cy="112" r="2" fill="#9060e8" opacity="0.6"/>
    <!-- home side indicator -->
    <rect x="124" y="120" width="3" height="10" rx="1.5" fill="#3d2a6a"/>
  </g>

  <!-- center attractor -->
  <circle cx="100" cy="125" r="4" fill="#9060e8" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- trailing particles -->
  <circle cx="100" cy="73" r="3" fill="#c0a0f8" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate"
      values="-30 100 125; 330 100 125" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="73" r="2" fill="#c0a0f8" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate"
      values="-60 100 125; 300 100 125" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="73" r="1.5" fill="#c0a0f8" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate"
      values="-90 100 125; 270 100 125" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
